<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALH.NAKOFA TV - Gidan Kallon Bidiyoyi da Labarai</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #ff0000;
            color: white;
            padding: 20px 0;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff0000;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            padding-top: 30px;
            height: 0;
            overflow: hidden;
            margin: 20px 0;
            border-radius: 8px;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .btn {
            display: inline-block;
            background-color: #ff0000;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #cc0000;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            background-color: #333;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        ALH.NAKOFA TV
    </header>

    <div class="container">
        <h1>Barka da Zuwa ALH.NAKOFA TV</h1>
        <p>Kalli sababbin bidiyoyi, labarai, da shirye-shirye masu ƙayatarwa kai tsaye daga tasharmu.</p>
        
        <!-- Wurin Saka Bidiyon YouTube (Zaka iya canza ID ɗin bidiyon daga baya) -->
        <div class="video-container">
            <iframe src="https://youtube.com" frameborder="0" allowfullscreen></iframe>
        </div>

        <p>Domin samun sababbin shirye-shiryenmu akan lokaci, ziyarci tasharmu ta YouTube:</p>
        <a href="https://youtube.com" target="_blank" class="btn">Kalli YouTube Channel ɗinmu</a>
    </div>

    <footer>
        &copy; 2026 ALH.NAKOFA TV. Dukkan haƙƙoƙi sun adana.
    </footer>

</body>
</html>
